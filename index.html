<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¡Aprueba la clase!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <section
        id="startScreen"
        class="start-screen"
        role="region"
        aria-label="Pantalla de inicio de Examen Challenge"
      >
        <button id="startButton" class="start-button" type="button">
          <span class="visually-hidden">Inicio: comenzar el examen</span>
        </button>
      </section>

      <header class="top-ui">
        <div class="score-panel pixel-card">
          <div class="score-label">
            <span class="star">★</span>
            <span>Puntos: <strong id="scoreValue">50</strong> / 100</span>
          </div>
          <div class="progress-bar">
            <div id="scoreFill" class="progress-fill"></div>
          </div>
          <div class="timer-label">
            <span>Tiempo: <strong id="timerValue">30</strong>s</span>
          </div>
          <div
            class="progress-bar timer-bar"
            role="progressbar"
            aria-label="Tiempo restante"
            aria-valuemin="0"
            aria-valuemax="30"
            aria-valuenow="30"
          >
            <div id="timerFill" class="timer-fill"></div>
          </div>
        </div>

        <div class="side-panels">
          <div class="pill pixel-card">
            <span>Nivel: <strong id="levelValue">1</strong></span>
          </div>
          <div class="pill pixel-card">
            <span>Pregunta: <strong id="questionValue">1 / 15</strong></span>
          </div>
        </div>
      </header>

      <main class="classroom-scene">
        <div class="classroom-bg"></div>

        <div class="question-panel pixel-card" id="questionPanel">
          <span id="questionText">Cargando pregunta...</span>
        </div>

        <div id="answersArea" class="answers-area"></div>

        <div id="toast" class="toast hidden"></div>
        <div id="resultOverlay" class="result-overlay hidden">
          <div class="popup pixel-card">
            <h2 id="resultTitle">Aprobado</h2>
            <p id="resultText">Nivel superado</p>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
